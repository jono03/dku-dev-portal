      <a class="sidebar__link" data-nav="new" href="builder.html">

          <p id="error-reason"></p>
          <dl class="kv mono-val" id="error-table"></dl>

          <ol class="steps" id="solutions"></ol>
          <div class="actions">
            <a class="btn" href="builder.html">설정으로 돌아가기</a>
            <button type="button" class="btn btn--secondary" data-action="approve">관리자 승인 요청</button>

      </div>

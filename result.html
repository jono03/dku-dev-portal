<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>추천 결과 - DKU Dev Portal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="result">
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__brand">DKU Dev Portal</div>
    <nav class="sidebar__nav" aria-label="주 메뉴">
      <a class="sidebar__link" data-nav="home" href="index.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 7.5L8 2.5l6 5M3.5 6.5V13.5h9V6.5"/></svg>
        Home
      </a>
      <a class="sidebar__link" data-nav="dashboard" href="dashboard.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>
        Dashboard
      </a>
      <a class="sidebar__link" data-nav="history" href="history.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>
        History
      </a>
      <a class="sidebar__link" data-nav="guided" href="survey.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg>
        Guided Setup
      </a>
      <a class="sidebar__link" data-nav="new" href="builder.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>
        New Env
      </a>
      <a class="sidebar__link" data-nav="mypage" href="mypage.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/></svg>
        My Page
      </a>
      <a class="sidebar__link" data-nav="help" href="help.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6.3 6.2c.2-1 1-1.5 1.8-1.5 1 0 1.7.6 1.7 1.4 0 1.2-1.7 1.3-1.7 2.6M8 11.2v.1"/></svg>
        Help
      </a>
    </nav>
    <div class="quota" id="quota-widget"></div>
  </aside>

  <div class="content">
    <header class="topbar"><span>서버 생성부터 배포까지 한곳에서</span><div class="topbar__user" id="topbar-user"></div></header>
    <main class="main">
      <div class="center-wrap">
        <section class="card center-card" id="result-card">
          <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
          <h1>추천 환경이 준비되었습니다</h1>
          <p>선택한 내용으로 구성한 결과입니다. 생성 전에 확인하세요.</p>
          <div class="field" style="margin-top:16px">
            <label class="field__label" for="rname-result">서버 이름</label>
            <input class="input" id="rname-result" type="text" maxlength="40" placeholder="예: 캡스톤 3조 백엔드">
          </div>
          <div class="field" style="margin-top:12px">
            <label class="field__label" for="project-input">프로젝트 <span class="optional">(선택)</span></label>
            <input class="input" id="project-input" type="text" list="project-list" maxlength="30" autocomplete="off" placeholder="예: 캡스톤 3조">
            <datalist id="project-list"></datalist>
            <p class="muted-p" style="margin-top:8px">같은 프로젝트로 묶으면 대시보드에서 프로젝트별로 모아 볼 수 있어요.</p>
          </div>
          <div class="field" style="margin-top:12px">
            <label class="field__label" for="repo-url">코드 저장소 연결 <span class="optional">(선택)</span></label>
            <div class="repo-fields">
              <input class="input" id="repo-url" type="text" autocomplete="off" placeholder="github.com/팀/프로젝트" aria-label="저장소 주소">
              <input class="input" id="repo-branch" type="text" autocomplete="off" placeholder="main" aria-label="브랜치">
            </div>
            <p class="muted-p" style="margin-top:8px" id="repo-msg">연결하면 push할 때마다 서버에 자동 배포됩니다. 나중에 대시보드에서도 연결할 수 있어요. (프로토타입: 시뮬레이션)</p>
          </div>
          <div id="preview" style="margin-top:16px"></div>
          <dl class="kv" id="receipt"></dl>
          <div id="receipt-note"></div>
          <p class="receipt-owner" id="owner-line"></p>
          <details class="hint">
            <summary>이 추천이 나온 이유</summary>
            <div id="reasons"></div>
          </details>
          <div class="actions">
            <button type="button" class="btn" data-action="create">이대로 생성</button>
            <a class="btn btn--secondary" href="builder.html">세부 조정하기</a>
            <button type="button" class="btn btn--secondary" data-action="save-template">템플릿으로 저장</button>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="assets/catalog.js"></script>
<script src="assets/state.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
